# Fly.io 배포 설정 — sourcebound
app = 'sourcebound'
primary_region = 'nrt'          # 도쿄 (한국에서 가장 가까움)

[build]
  dockerfile = 'Dockerfile'

[env]
  # 리랭커는 CPU에서 비싼 단계(응답의 절반 이상) — 후보 수가 곧 리랭킹 시간이다.
  # TOP_K=4가 하한(최종 근거 4개)이라 4로 낮춰 리랭킹 쌍을 20% 줄인다.
  MPA_CANDIDATE_POOL = '4'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'suspend'  # 미사용 시 '일시정지'(메모리 상태 보존).
                                  # stop과 달리 깨어날 때 모델을 다시 안 올려 콜드스타트 없음(1~3초 복원).
  auto_start_machines = true      # 접속 오면 자동 재개
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # 공유 CPU는 리랭커에서 스로틀링(30~100초, 편차 큼) → 전용 CPU로 전환.
  # 전용 2코어면 로컬 수준(~14초, 일정). auto-stop/suspend로 유휴 시 과금 최소화가 전제.
  cpu_kind = 'performance'
  cpus = 2
  memory_mb = 8192
